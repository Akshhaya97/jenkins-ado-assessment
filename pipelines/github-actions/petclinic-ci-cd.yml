name: "PetClinic — Build, Scan, Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write       # required for OIDC azure/login
  contents: read
  security-events: write  # upload Trivy SARIF to GitHub Security tab

# ── Stage 1: Build & Test ─────────────────────────────────────────────────────
jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.vars.outputs.short_sha }}
      image-tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git rev-parse works

      - name: Compute image tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          IMAGE_TAG="${{ github.run_id }}-git-${SHORT_SHA}"
          echo "short_sha=${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}"   >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Maven test + package
        run: ./mvnw -f apps/spring-petclinic/pom.xml test package -DskipITs
        working-directory: ${{ github.workspace }}

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/spring-petclinic/target/surefire-reports/

      - name: Publish JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: apps/spring-petclinic/target/*.jar

      - name: Docker build
        run: |
          docker build \
            -f apps/container/Dockerfile \
            -t ${{ vars.IMAGE_REPOSITORY }}:${{ steps.vars.outputs.image_tag }} \
            -t ${{ vars.IMAGE_REPOSITORY }}:${{ github.run_id }} \
            .

      - name: Save image as artifact
        run: |
          docker save ${{ vars.IMAGE_REPOSITORY }}:${{ steps.vars.outputs.image_tag }} \
            | gzip > /tmp/image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar.gz

# ── Stage 2: Security Scan ────────────────────────────────────────────────────
  security-scan:
    name: "Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: |
          docker load < /tmp/image.tar.gz
          echo "Loaded: ${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}"

      - name: Run Trivy — JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}"
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # don't fail here — fail on SARIF step below

      - name: Run Trivy — SARIF (upload to Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}"
          format: sarif
          output: trivy-report.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"   # fails job if HIGH/CRITICAL CVEs found

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

# ── Stage 3: Push to ACR ──────────────────────────────────────────────────────
  push-to-acr:
    name: "Push to ACR"
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load < /tmp/image.tar.gz

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ vars.ACR_LOGIN_SERVER }}

      - name: Tag and push image
        run: |
          IMAGE_TAG="${{ needs.build-and-test.outputs.image-tag }}"
          ACR="${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_REPOSITORY }}"

          docker tag ${{ vars.IMAGE_REPOSITORY }}:${IMAGE_TAG} ${ACR}:${IMAGE_TAG}
          docker push ${ACR}:${IMAGE_TAG}
          echo "Pushed: ${ACR}:${IMAGE_TAG}"

# ── Stage 4: Deploy → Dev ─────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy → Dev"
    runs-on: ubuntu-latest
    needs: push-to-acr
    environment: dev   # no protection rules — auto-deploys

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service — Dev
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME_DEV }}
          images: "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}"

      - name: Capture deployment logs
        if: always()
        run: |
          az webapp log tail \
            --name ${{ vars.APP_SERVICE_NAME_DEV }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --timeout 15 || true

# ── Stage 5: Smoke Test — Dev ─────────────────────────────────────────────────
  smoke-test-dev:
    name: "Smoke Test — Dev"
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for app to start
        run: sleep 30

      - name: HTTP smoke test
        run: |
          URL="${{ vars.APP_URL_DEV }}"
          echo "Testing: ${URL}"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}/actuator/health")
            echo "Attempt ${i}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test failed after 5 attempts."
          exit 1

# ── Stage 6: Deploy → Prod ────────────────────────────────────────────────────
# GitHub Environment "prod" must have Required Reviewers configured:
#   Repository → Settings → Environments → prod → Required reviewers → add approvers
# The job pauses here until an approver approves via the GitHub UI.
  deploy-prod:
    name: "Deploy → Prod"
    runs-on: ubuntu-latest
    needs: smoke-test-dev
    environment: prod   # triggers approval gate

    steps:
      - name: Azure login (OIDC — prod identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service — Prod
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME_PROD }}
          images: "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}"

      - name: Tag deployed image as :stable in ACR
        run: |
          az acr import \
            --name ${{ vars.ACR_LOGIN_SERVER }} \
            --source "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_REPOSITORY }}:${{ needs.build-and-test.outputs.image-tag }}" \
            --image "${{ vars.IMAGE_REPOSITORY }}:stable" \
            --force

      - name: Capture deployment logs
        if: always()
        run: |
          az webapp log tail \
            --name ${{ vars.APP_SERVICE_NAME_PROD }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --timeout 15 || true

# ── Stage 7: Post-Deploy Validation — Prod ────────────────────────────────────
  post-deploy-validation:
    name: "Post-Deploy Validation — Prod"
    runs-on: ubuntu-latest
    needs: deploy-prod

    steps:
      - name: Wait for app to start
        run: sleep 30

      - name: Health check
        run: |
          URL="${{ vars.APP_URL_PROD }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}/actuator/health")
          echo "Health check: HTTP ${STATUS}"
          [ "${STATUS}" = "200" ] || (echo "Health check failed" && exit 1)

      - name: Response time check
        run: |
          URL="${{ vars.APP_URL_PROD }}"
          RESPONSE_TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 15 "${URL}")
          echo "Response time: ${RESPONSE_TIME}s"
          awk "BEGIN { exit (${RESPONSE_TIME} > 3.0) ? 1 : 0 }" \
            || (echo "Response time exceeded 3s threshold" && exit 1)

      - name: Readiness check
        run: |
          URL="${{ vars.APP_URL_PROD }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${URL}/actuator/health/readiness")
          echo "Readiness: HTTP ${STATUS}"
          [ "${STATUS}" = "200" ] || (echo "Readiness check failed" && exit 1)

# ── Stage 8: Rollback — Prod ──────────────────────────────────────────────────
# Runs only if deploy-prod or post-deploy-validation fails.
# Re-deploys the image tagged :stable (last known-good build).
  rollback:
    name: "Rollback — Prod"
    runs-on: ubuntu-latest
    needs: [deploy-prod, post-deploy-validation]
    if: |
      always() &&
      (needs.deploy-prod.result == 'failure' || needs.post-deploy-validation.result == 'failure')
    environment: prod

    steps:
      - name: Azure login (OIDC — prod identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback to :stable image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME_PROD }}
          images: "${{ vars.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_REPOSITORY }}:stable"

      - name: Log rollback event
        run: |
          echo "ROLLBACK EXECUTED"
          echo "Run ID    : ${{ github.run_id }}"
          echo "Triggered : ${{ github.actor }}"
          echo "Reason    : deploy-prod=${{ needs.deploy-prod.result }} | validation=${{ needs.post-deploy-validation.result }}"

stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: petclinic
  REGISTRY: legacy-registry.local

test:
  stage: test
  tags:
    - docker
  script:
    - ./mvnw test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/

build_image:
  stage: build
  tags:
    - docker
  script:
    - docker build -f apps/container/Dockerfile -t $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA

deploy_dev:
  stage: deploy
  when: manual
  environment:
    name: dev
  script:
    - ./scripts/deploy-vm.sh dev